<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | Kazadeh</title>

<style>
body{
font-family:Arial,sans-serif;
background:#eef3ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
width:300px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

a{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h2>ورود به کازاده</h2>

<input id="phone" type="text" placeholder="شماره تماس">

<input id="password" type="password" placeholder="رمز عبور">

<button onclick="login()">ورود</button>

<a href="register.html">ثبت‌نام</a>

</div>

<script>
function login(){

let phone=document.getElementById("phone").value;
let password=document.getElementById("password").value;

if(
phone===localStorage.getItem("phone") &&
password===localStorage.getItem("password")
){
location.href="panel.html";
}else{
alert("شماره تماس یا رمز عبور اشتباه است.");
}

}
</script>

</body>
</html>
