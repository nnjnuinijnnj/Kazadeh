<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیام‌های مدرس</title>

<style>
body{
  font-family: Arial;
  background: #f4f6ff;
  padding: 20px;
}
.msg{
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,.1);
}
.sender{
  font-weight: bold;
  color: #2563eb;
}
.time{
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<h2>پیام‌های مدرس</h2>
<div id="messages"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = supabase.createClient(
  "https://kkfkmpatxeuokhwxiani.supabase.co",
  "sb_publishable_Ie_nh_pDh62Q06UPUEWjjw_dI1mS0tU"
);

async function loadMessages(){
  let { data, error } = await supabase
    .from("messages")
    .select("*")
    .order("id", { ascending: false });

  if(error){
    document.getElementById("messages").innerHTML = "خطا در دریافت پیام‌ها";
    return;
  }

  let box = "";
  data.forEach(msg => {
    box += `
      <div class="msg">
        <div class="sender">${msg.sender}</div>
        <div>${msg.text}</div>
        <div class="time">${msg.time}</div>
      </div>
    `;
  });

  document.getElementById("messages").innerHTML = box;
}

loadMessages();
</script>

</body>
</html>
