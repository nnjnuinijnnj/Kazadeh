<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>چت مدرس</title>
<style>
body{font-family:Arial;background:#eef3ff;padding:20px;}
.box{background:white;padding:20px;border-radius:10px;width:300px;margin:auto;}
textarea,button{width:100%;padding:10px;margin-top:10px;}
button{background:#2563eb;color:white;border:none;border-radius:8px;}
</style>
</head>

<body>
<div class="box">
  <h3>ارسال پیام مدرس</h3>
  <textarea id="msg" placeholder="متن پیام..." rows="5"></textarea>
  <button onclick="send()">ارسال پیام</button>
</div>

<script>
function send(){
  let text = document.getElementById("msg").value;
  if(text.trim()===""){ alert("خالیه!"); return; }

  let messages = JSON.parse(localStorage.getItem("messages") || "[]");

  messages.push({
    sender: "مدرس",
    text: text,
    time: new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})
  });

  localStorage.setItem("messages", JSON.stringify(messages));

  document.getElementById("msg").value = "";
}
</script>
</body>
</html>
